[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "cr-films-to-prehrajto"
version = "0.1.0"
description = "Safe hybrid pilot for mirroring CR films to Prehraj.to"
requires-python = ">=3.12"
dependencies = [
  "beautifulsoup4>=4.12",
  "psycopg2-binary>=2.9",
  "requests>=2.31",
]

[project.optional-dependencies]
test = ["pytest>=8.0"]
whisper = ["faster-whisper>=1.0"]

[project.scripts]
cr-films-pilot = "cr_films_to_prehrajto.cli:main"
cr-films-index = "cr_films_to_prehrajto.account_index:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
